name: Generate Profile Graphics

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight UTC
  workflow_dispatch:      # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write card settings (transparent background)
        run: |
          cat > /tmp/3d-settings.json <<'JSONEOF'
          {
            "type": "rainbow",
            "fileName": "profile-3d.svg",
            "backgroundColor": "transparent",
            "foregroundColor": "#24292f",
            "strongColor": "#d97706",
            "weakColor": "#8c959f",
            "radarColor": "#d97706",
            "growingAnimation": true,
            "saturation": "60%",
            "contribLightness": [
              "92%",
              "75%",
              "65%",
              "55%",
              "45%"
            ],
            "duration": "10s",
            "hueRatio": -7,
            "darkMode": {
              "type": "rainbow",
              "backgroundColor": "transparent",
              "foregroundColor": "#e6edf3",
              "strongColor": "rgb(255,200,55)",
              "weakColor": "#8b949e",
              "radarColor": "rgb(255,200,55)",
              "growingAnimation": true,
              "saturation": "50%",
              "contribLightness": [
                "20%",
                "30%",
                "35%",
                "40%",
                "50%"
              ],
              "duration": "10s",
              "hueRatio": -7
            }
          }
          JSONEOF

      - name: Generate 3D contribution and stats card
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: /tmp/3d-settings.json

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate growing snake and code card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          cat > /tmp/profile_graphics.py <<'PYEOF'
          """Builds a growing contribution snake and an animated code card (stdlib only)."""
          import json, os, sys, urllib.request

          USER = os.environ.get("USERNAME", "chamara2002")
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          OUT = sys.argv[1] if len(sys.argv) > 1 else "dist"
          os.makedirs(OUT, exist_ok=True)

          # ---------------------------------------------------------------- data
          def fetch_levels():
              if os.environ.get("SAMPLE_DATA"):
                  import random
                  random.seed(3)
                  return [[random.choice([0, 0, 0, 1, 2, 3, 4]) for _ in range(7)] for _ in range(53)]
              q = """query($login:String!){user(login:$login){contributionsCollection{
                contributionCalendar{weeks{contributionDays{weekday contributionLevel}}}}}}"""
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": q, "variables": {"login": USER}}).encode(),
                  headers={"Authorization": f"bearer {TOKEN}", "Content-Type": "application/json"},
              )
              weeks = json.load(urllib.request.urlopen(req))["data"]["user"][
                  "contributionsCollection"]["contributionCalendar"]["weeks"]
              lv = {"NONE": 0, "FIRST_QUARTILE": 1, "SECOND_QUARTILE": 2,
                    "THIRD_QUARTILE": 3, "FOURTH_QUARTILE": 4}
              grid = []
              for w in weeks:
                  col = [None] * 7  # None = day not in calendar yet
                  for d in w["contributionDays"]:
                      col[d["weekday"]] = lv[d["contributionLevel"]]
                  grid.append(col)
              return grid

          # ---------------------------------------------------------------- snake
          CELL, GAP, PAD = 12, 3, 14
          STEP = CELL + GAP
          THEMES = {
              "github-snake.svg": dict(
                  empty="#ebedf0", levels=["#ebedf0", "#9be9a8", "#40c463", "#30a14e", "#216e39"],
                  head="#0e75b6", body="#38bdf8"),
              "github-snake-dark.svg": dict(
                  empty="#161b22", levels=["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"],
                  head="#7dd3fc", body="#38bdf8"),
          }
          START_LEN, MAX_LEN, STEP_SEC = 3, 40, 0.06

          def snake_svg(grid, t):
              cols = len(grid)
              # Boustrophedon route through every cell: down one column, up the next.
              path = []
              for c in range(cols):
                  rows = range(7) if c % 2 == 0 else range(6, -1, -1)
                  path += [(c, r) for r in rows]
              # Start off-grid on the left so the snake slides in.
              lead = [(-i, 0) for i in range(START_LEN + 1, 0, -1)]
              path = lead + path + [(cols + i, path[-1][1]) for i in range(1, MAX_LEN + 2)]
              n = len(path)
              hold = 25  # extra frames to pause before looping
              frames = n + hold
              dur = frames * STEP_SEC

              # Length after each step: +1 for every contribution cell eaten.
              length, lengths, eaten_at = START_LEN, [], {}
              for i, (c, r) in enumerate(path):
                  if 0 <= c < cols and grid[c][r]:
                      length = min(MAX_LEN, length + 1)
                      eaten_at[(c, r)] = i
                  lengths.append(length)
              longest = max(lengths)

              kt = ";".join(f"{i / (frames - 1):.5f}" for i in range(frames))
              px = lambda c: PAD + c * STEP
              py = lambda r: PAD + r * STEP
              W, H = PAD * 2 + cols * STEP - GAP, PAD * 2 + 7 * STEP - GAP

              out = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}">']
              # Grid cells; eaten ones fade to empty at the moment the head arrives.
              for c in range(cols):
                  for r in range(7):
                      v = grid[c][r]
                      if v is None:
                          continue
                      x, y = px(c), py(r)
                      if v and (c, r) in eaten_at:
                          k = eaten_at[(c, r)] / (frames - 1)
                          out.append(
                              f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" rx="2.5" fill="{t["levels"][v]}">'
                              f'<animate attributeName="fill" dur="{dur:.2f}s" repeatCount="indefinite" calcMode="discrete" '
                              f'keyTimes="0;{k:.5f}" values="{t["levels"][v]};{t["empty"]}"/></rect>')
                      else:
                          out.append(f'<rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" rx="2.5" fill="{t["levels"][v]}"/>')

              # Snake: every segment follows one shared CSS path, delayed by s steps.
              kf = "".join(
                  f"{min(f, n - 1) / (frames - 1) * 100:.3f}%{{transform:translate({px(path[min(f, n - 1)][0])}px,{py(path[min(f, n - 1)][1])}px)}}"
                  for f in range(frames) if f < n or f == frames - 1)
              css = [f"@keyframes m{{{kf}}}",
                     f".s{{animation:m {dur:.2f}s linear infinite;transform:translate(-200px,0)}}"]
              segs = []
              for s in range(longest - 1, -1, -1):
                  appear = next(i for i, L in enumerate(lengths) if L > s)
                  p = appear / (frames - 1) * 100
                  if s >= START_LEN:
                      css.append(f"@keyframes o{s}{{0%,{p:.3f}%{{opacity:0}}{p + 0.001:.3f}%,100%{{opacity:1}}}}")
                      vis = f"animation:o{s} {dur:.2f}s step-end infinite"
                  else:
                      vis = ""
                  inset = 0 if s == 0 else 1.0
                  size = CELL - inset * 2
                  color = t["head"] if s == 0 else t["body"]
                  o = 1.0 if s == 0 else 1 - 0.5 * s / max(longest, 1)
                  segs.append(
                      f'<g class="s" style="animation-delay:{s * STEP_SEC:.2f}s"><rect x="{inset:.1f}" y="{inset:.1f}" '
                      f'width="{size:.1f}" height="{size:.1f}" rx="{3 if s else 4}" fill="{color}" fill-opacity="{o:.2f}" '
                      f'style="{vis}"/></g>')
              out.insert(1, "<style>" + "".join(css) + "</style>")
              out += segs
              out.append("</svg>")
              return "".join(out)

          # ---------------------------------------------------------------- code card
          CODE = [
              [("const ", "#bb9af7"), ("chamara", "#7aa2f7"), (" = {", "#c0caf5")],
              [("  role", "#7dcfff"), (": ", "#c0caf5"), ('"IT Undergraduate @ SLIIT"', "#9ece6a"), (",", "#c0caf5")],
              [("  focus", "#7dcfff"), (": [", "#c0caf5"), ('"Full-Stack"', "#9ece6a"), (", ", "#c0caf5"), ('"ML"', "#9ece6a"), (", ", "#c0caf5"), ('"AWS"', "#9ece6a"), ("],", "#c0caf5")],
              [("  location", "#7dcfff"), (": ", "#c0caf5"), ('"Sri Lanka"', "#9ece6a"), (",", "#c0caf5")],
              [("  stack", "#7dcfff"), (": [", "#c0caf5"), ('"Python"', "#9ece6a"), (", ", "#c0caf5"), ('"Java"', "#9ece6a"), (", ", "#c0caf5"), ('"JS"', "#9ece6a"), ("],", "#c0caf5")],
              [("  learning", "#7dcfff"), (": ", "#c0caf5"), ('"MLOps & System Design"', "#9ece6a"), (",", "#c0caf5")],
              [("  passion", "#7dcfff"), (": ", "#c0caf5"), ('"Problem Solving"', "#9ece6a"), (",", "#c0caf5")],
              [("};", "#c0caf5")],
              [],
              [("function ", "#bb9af7"), ("dailyRoutine", "#7aa2f7"), ("() {", "#c0caf5")],
              [("  while ", "#bb9af7"), ("(", "#c0caf5"), ("curious", "#e0af68"), (") {", "#c0caf5")],
              [("    learn", "#7aa2f7"), ("(); ", "#c0caf5"), ("build", "#7aa2f7"), ("(); ", "#c0caf5"), ("deploy", "#7aa2f7"), ("();", "#c0caf5")],
              [("  }", "#c0caf5")],
              [("}", "#c0caf5")],
              [],
              [("chamara", "#7aa2f7"), (".", "#c0caf5"), ("build", "#7dcfff"), ("(", "#c0caf5"), ('"something great"', "#9ece6a"), (");", "#c0caf5")],
          ]

          def esc(s):
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def code_svg():
              W, H, CH, LH, X0, Y0 = 480, 500, 8.4, 26, 50, 78
              typing, gap, hold = 0.7, 0.2, 4.0
              total = len(CODE) * (typing + gap) + hold
              o = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}" '
                   f'font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">',
                   '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
                   '<stop offset="0" stop-color="#0f2027"/><stop offset=".5" stop-color="#203a43"/>'
                   '<stop offset="1" stop-color="#2c5364"/></linearGradient></defs>',
                   f'<rect width="{W}" height="{H}" rx="14" fill="url(#g)"/>',
                   f'<rect x="10" y="10" width="{W-20}" height="{H-20}" rx="10" fill="#1a1b26"/>',
                   f'<rect x="10" y="10" width="{W-20}" height="34" rx="10" fill="#16161e"/>',
                   f'<rect x="10" y="34" width="{W-20}" height="10" fill="#16161e"/>',
                   '<circle cx="30" cy="27" r="5.5" fill="#ff5f57"/><circle cx="48" cy="27" r="5.5" fill="#febc2e"/>'
                   '<circle cx="66" cy="27" r="5.5" fill="#28c840"/>',
                   f'<text x="{W/2}" y="31" text-anchor="middle" fill="#565f89" font-size="12">chamara.js</text>']
              for i, toks in enumerate(CODE):
                  y = Y0 + i * LH
                  o.append(f'<text x="22" y="{y}" fill="#3b4261" text-anchor="start">{i+1:>2}</text>')
                  if not toks:
                      continue
                  chars = sum(len(t) for t, _ in toks)
                  w = chars * CH + 4
                  start = i * (typing + gap)
                  a, b = start / total, (start + typing) / total
                  o.append(f'<clipPath id="c{i}"><rect x="{X0}" y="{y-16}" height="22" width="0">'
                           f'<animate attributeName="width" dur="{total:.2f}s" repeatCount="indefinite" '
                           f'keyTimes="0;{a:.4f};{b:.4f};0.97;1" values="0;0;{w:.1f};{w:.1f};0"/></rect></clipPath>')
                  spans = "".join(f'<tspan fill="{c}">{esc(t)}</tspan>' for t, c in toks)
                  o.append(f'<text x="{X0}" y="{y}" clip-path="url(#c{i})" xml:space="preserve">{spans}</text>')
              # Blinking cursor that follows the typing.
              xs, ys, kts = [], [], []
              for i, toks in enumerate(CODE):
                  chars = sum(len(t) for t, _ in toks)
                  start = i * (typing + gap)
                  y = Y0 + i * LH - 13
                  for tt, xx in ((start, 0), (start + typing, chars * CH)):
                      kts.append(tt / total); xs.append(f"{X0 + xx + 1:.1f}"); ys.append(str(y))
              kts = [0.0] + kts[1:] + [1.0]; xs.append(xs[-1]); ys.append(ys[-1])
              kt = ";".join(f"{k:.4f}" for k in kts)
              o.append(f'<rect width="2" height="17" fill="#38bdf8">'
                       f'<animate attributeName="x" dur="{total:.2f}s" repeatCount="indefinite" keyTimes="{kt}" values="{";".join(xs)}"/>'
                       f'<animate attributeName="y" dur="{total:.2f}s" repeatCount="indefinite" calcMode="discrete" keyTimes="{kt}" values="{";".join(ys)}"/>'
                       f'<animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.5;.5;1" calcMode="discrete"/></rect>')
              o.append("</svg>")
              return "".join(o)

          grid = fetch_levels()
          for name, theme in THEMES.items():
              with open(os.path.join(OUT, name), "w") as f:
                  f.write(snake_svg(grid, theme))
          with open(os.path.join(OUT, "coding-card.svg"), "w") as f:
              f.write(code_svg())
          print("done:", os.listdir(OUT))
          PYEOF
          python3 /tmp/profile_graphics.py dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
